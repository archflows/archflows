<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080" />
    <title>ArcFlows intro</title>
    <style>
      @font-face {
        font-family: Sora;
        src: url("fonts/Sora-Regular.ttf") format("truetype");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: Sora;
        src: url("fonts/Sora-SemiBold.ttf") format("truetype");
        font-weight: 600;
        font-display: block;
      }
      @font-face {
        font-family: Sora;
        src: url("fonts/Sora-Bold.ttf") format("truetype");
        font-weight: 700;
        font-display: block;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #050814;
        font-family: Sora, sans-serif;
        color: #fff;
      }

      #stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      #bg {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 140%;
        height: 140%;
        object-fit: cover;
        transform: translate(-50%, -50%) scale(1);
        transform-origin: center 72%;
      }

      #veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(5, 8, 20, 0.42) 0%,
          rgba(5, 8, 20, 0.18) 40%,
          rgba(5, 8, 20, 0.08) 58%,
          rgba(5, 8, 20, 0.4) 100%
        );
      }

      #logo {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 860px;
        height: auto;
        transform: translate(-50%, -50%);
        opacity: 0;
        will-change: transform, opacity;
      }

      #copy {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 48px;
        text-align: center;
        font-weight: 700;
        font-size: 118px;
        line-height: 1.08;
        letter-spacing: -0.045em;
        white-space: pre-line;
        opacity: 0;
        will-change: transform, opacity;
      }

      #copy .line {
        display: block;
      }

      #copy .accent {
        color: #8bb7ff;
      }

      #mark {
        position: absolute;
        left: 50%;
        top: 24%;
        transform: translate(-50%, -50%);
        font-weight: 700;
        font-size: 220px;
        letter-spacing: -0.07em;
        color: rgba(255, 255, 255, 0.2);
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        line-height: 1;
      }

      #dash-wrap {
        position: absolute;
        left: 50%;
        bottom: 72px;
        width: 1120px;
        transform: translateX(-50%);
        opacity: 0;
        will-change: transform, opacity;
        filter: drop-shadow(0 32px 60px rgba(0, 24, 90, 0.55));
      }

      #dash {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 22px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <img id="bg" src="../bahan/bcakgound.png" alt="" />
      <div id="veil"></div>
      <div id="mark">arcflows</div>
      <img id="logo" src="logo.png" alt="ArcFlows" />
      <div id="copy"></div>
      <div id="dash-wrap">
        <img id="dash" src="../bahan/dsabord.png" alt="" />
      </div>
    </div>
    <script>
      const DURATION = 15;

      const SCENES = [
        { start: 0.0, end: 1.7, logo: true },
        { start: 1.5, end: 3.0, text: "This is\nArcFlows.", size: 128 },
        { start: 2.8, end: 4.3, text: "Token locks\non Arc.", size: 118 },
        { start: 4.1, end: 5.6, text: "Lock.\nVest.\nStream.", size: 120 },
        { start: 5.4, end: 6.9, text: "Airdrop.\nEscrow.\nStake.", size: 112 },
        { start: 6.7, end: 8.15, text: "Immutable\nschedules.", size: 118 },
        { start: 7.95, end: 9.4, text: "Public proof\npages.", size: 118 },
        { start: 9.2, end: 10.65, text: "Gas paid in\nUSDC.", size: 124, highlight: "USDC." },
        { start: 10.45, end: 11.9, text: "Built\nfor Arc.", size: 140 },
        { start: 11.7, end: 15.0, endcard: true },
      ];

      const els = {
        bg: document.getElementById("bg"),
        logo: document.getElementById("logo"),
        copy: document.getElementById("copy"),
        dash: document.getElementById("dash-wrap"),
        mark: document.getElementById("mark"),
      };

      function clamp(v, a, b) {
        return Math.max(a, Math.min(b, v));
      }
      function easeOut(t) {
        return 1 - Math.pow(1 - clamp(t, 0, 1), 3);
      }
      function fade(t, start, end, fadeIn = 0.22, fadeOut = 0.22) {
        if (t < start || t > end) return 0;
        return Math.min(easeOut((t - start) / fadeIn), easeOut((end - t) / fadeOut));
      }

      function renderCopy(scene, t) {
        const lines = scene.text.split("\n");
        const local = t - scene.start;
        els.copy.style.fontSize = (scene.size || 118) + "px";
        els.copy.innerHTML = lines
          .map((line, i) => {
            const on = easeOut((local - i * 0.08) / 0.28);
            const html = scene.highlight
              ? line.replace(
                  scene.highlight,
                  `<span class="accent">${scene.highlight}</span>`
                )
              : line;
            return `<span class="line" style="opacity:${on};transform:translateY(${(1 - on) * 24}px)">${html}</span>`;
          })
          .join("");
      }

      function seek(time) {
        const t = clamp(time, 0, DURATION);
        els.bg.style.transform = `translate(-50%, -50%) scale(${1 + 0.08 * (t / DURATION)})`;

        let copyOp = 0;
        let logoOp = 0;
        let active = null;

        for (const scene of SCENES) {
          if (scene.endcard) continue;
          if (scene.logo) {
            logoOp = Math.max(logoOp, fade(t, scene.start, scene.end, 0.35, 0.28));
            continue;
          }
          const op = fade(t, scene.start, scene.end);
          if (op > copyOp) {
            copyOp = op;
            active = scene;
          }
        }

        if (active) renderCopy(active, t);

        els.copy.style.opacity = String(copyOp);
        els.copy.style.transform = `translateY(${(1 - copyOp) * 18}px)`;
        els.logo.style.opacity = String(logoOp);
        els.logo.style.transform = `translate(-50%, -50%) scale(${0.94 + 0.06 * logoOp})`;

        const end = fade(t, 11.85, 15.0, 0.42, 0.01);
        els.mark.style.opacity = String(end);
        els.mark.style.transform = `translate(-50%, -50%) scale(${0.96 + 0.04 * end})`;
        els.dash.style.opacity = String(end);
        els.dash.style.transform = `translateX(-50%) translateY(${(1 - end) * 80}px)`;
      }

      window.seek = seek;
      window.DURATION = DURATION;

      async function ready() {
        await document.fonts.ready;
        await Promise.all(
          [...document.images].map((img) =>
            img.complete
              ? Promise.resolve()
              : new Promise((resolve) => {
                  img.onload = resolve;
                  img.onerror = resolve;
                })
          )
        );
        window.__ready = true;
        seek(0);
      }

      ready().then(() => {
        if (new URLSearchParams(location.search).has("render")) return;
        let start = performance.now();
        const loop = (now) => {
          seek(((now - start) / 1000) % (DURATION + 1.2));
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      });
    </script>
  </body>
</html>
