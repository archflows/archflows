<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1600" />
    <title>ArcFlow post card</title>
    <style>
      @font-face {
        font-family: Sora;
        src: url("/intro/fonts/Sora-Regular.ttf") format("truetype");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: Sora;
        src: url("/intro/fonts/Sora-SemiBold.ttf") format("truetype");
        font-weight: 600;
        font-display: block;
      }
      @font-face {
        font-family: Sora;
        src: url("/intro/fonts/Sora-Bold.ttf") format("truetype");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("fonts/IBMPlexMono-Regular.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("fonts/IBMPlexMono-Medium.woff2") format("woff2");
        font-weight: 500;
        font-display: block;
      }

      :root {
        --void: #08090c;
        --deep: #070b14;
        --panel: #12131a;
        --ink: #ffffff;
        --dim: #9ca3af;
        --brand: #0050e0;
        --ion: #4d8aff;
        --eyebrow: #9ec2ff;
        --hairline: rgba(255, 255, 255, 0.08);
        --line: rgba(148, 163, 184, 0.1);
        --line-strong: rgba(148, 163, 184, 0.18);
        --bloom: radial-gradient(
            120% 160% at 108% 50%,
            #3b7aff 0%,
            #0050e0 26%,
            rgba(0, 48, 176, 0.4) 52%,
            transparent 74%
          ),
          #070b14;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background: var(--void);
        color: var(--ink);
        font-family: Sora, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #stage {
        position: relative;
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background: var(--void);
      }

      /* base plate from content/bahan, same asset the intro video uses */
      #bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* darken top-left for the headline, let the blue horizon stay visible
         bottom-right so the glow reads as a deliberate diagonal */
      #veil {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            180deg,
            rgba(5, 8, 20, 0.82) 0%,
            rgba(5, 8, 20, 0.58) 34%,
            rgba(5, 8, 20, 0.44) 58%,
            rgba(5, 8, 20, 0.74) 100%
          ),
          linear-gradient(
            90deg,
            rgba(5, 8, 20, 0.8) 0%,
            rgba(5, 8, 20, 0.34) 56%,
            rgba(5, 8, 20, 0) 100%
          );
      }

      #frame {
        position: absolute;
        inset: 0;
        padding: 72px 88px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .logo {
        height: 54px;
        width: auto;
        display: block;
      }

      .eyebrow {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 500;
        font-size: 19px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--eyebrow);
      }

      .pill {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 500;
        font-size: 17px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #bfdbfe;
        border: 1px solid rgba(0, 80, 224, 0.45);
        background: rgba(0, 80, 224, 0.14);
        border-radius: 999px;
        padding: 10px 20px;
      }

      .body {
        flex: 1;
        display: flex;
        align-items: center;
        min-height: 0;
      }

      h1 {
        margin: 0;
        font-weight: 700;
        font-size: 112px;
        line-height: 1.05;
        letter-spacing: -0.042em;
        white-space: pre-line;
      }

      h1 .accent {
        color: var(--ion);
      }

      .lead {
        margin: 28px 0 0;
        font-size: 28px;
        line-height: 1.5;
        color: var(--dim);
        max-width: 880px;
      }

      .bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        font-family: "IBM Plex Mono", monospace;
        font-size: 18px;
        letter-spacing: 0.06em;
        color: rgba(148, 163, 184, 0.85);
        border-top: 1px solid var(--hairline);
        padding-top: 26px;
      }

      .bottom .rule-note {
        color: rgba(148, 163, 184, 0.6);
      }

      /* ---------- statement ---------- */
      .t-statement .body {
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
      }
      .t-statement h1 {
        font-size: 124px;
      }

      /* ---------- shot ---------- */
      .t-shot .body {
        align-items: center;
        gap: 56px;
      }
      .t-shot .col-copy {
        width: 700px;
        flex-shrink: 0;
      }
      .t-shot h1 {
        font-size: 92px;
      }
      .t-shot .lead {
        font-size: 25px;
        max-width: 640px;
        margin-top: 22px;
      }
      .bullets {
        list-style: none;
        margin: 32px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .bullets li {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 22px;
        color: #e2e8f0;
      }
      .bullets li::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 2px;
        background: var(--ion);
        flex-shrink: 0;
      }
      .shot-wrap {
        position: relative;
        flex: 1;
        min-width: 0;
        display: flex;
        justify-content: flex-end;
      }
      .shot-glow {
        position: absolute;
        inset: -10% -6%;
        background: radial-gradient(
          55% 55% at 50% 50%,
          rgba(0, 80, 224, 0.32),
          transparent 72%
        );
      }
      /* width:100% + height:auto + max-height keeps the ratio and never
         reaches the eyebrow or the footer rule, whatever the asset ratio is */
      .shot {
        position: relative;
        width: 100%;
        height: auto;
        max-height: 620px;
        border: 1px solid rgba(210, 225, 255, 0.14);
        border-radius: 16px;
        display: block;
        box-shadow: 0 40px 90px rgba(0, 12, 48, 0.6);
      }

      /* ---------- hero ----------
         wide dashboard shots are illegible squeezed into a column, so this
         runs them near native width and bleeds them off the bottom edge */
      .t-hero #frame {
        padding-bottom: 0;
      }
      .t-hero .body {
        flex-direction: column;
        align-items: stretch;
        justify-content: space-between;
        gap: 26px;
        padding-top: 34px;
      }
      .t-hero h1 {
        font-size: 78px;
      }
      .t-hero .lead {
        margin-top: 16px;
        font-size: 25px;
        max-width: 1000px;
      }
      .hero-shot {
        width: 100%;
        height: 500px;
        overflow: hidden;
        position: relative;
        border: 1px solid rgba(210, 225, 255, 0.16);
        border-bottom: none;
        border-radius: 18px 18px 0 0;
        box-shadow: 0 -14px 70px rgba(0, 24, 90, 0.5);
        flex-shrink: 0;
      }
      .hero-shot img {
        width: 100%;
        height: auto;
        display: block;
      }

      /* ---------- proof ---------- */
      .t-proof .body {
        gap: 52px;
        align-items: center;
      }
      .t-proof .col-copy {
        width: 640px;
        flex-shrink: 0;
      }
      .t-proof h1 {
        font-size: 84px;
      }
      .t-proof .lead {
        font-size: 24px;
        max-width: 560px;
      }
      .proof-card {
        position: relative;
        flex: 1;
        min-width: 0;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid var(--line-strong);
        background: var(--void);
        padding: 36px 38px 30px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 40px 90px rgba(0, 12, 48, 0.6);
      }
      .proof-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .proof-veil {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            180deg,
            rgba(8, 9, 12, 0.46) 0%,
            rgba(8, 9, 12, 0.38) 42%,
            rgba(8, 9, 12, 0.88) 100%
          ),
          linear-gradient(
            100deg,
            rgba(8, 9, 12, 0.88) 0%,
            rgba(8, 9, 12, 0.58) 64%,
            rgba(8, 9, 12, 0.34) 100%
          );
      }
      .proof-inner {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .proof-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .proof-head img {
        height: 26px;
        width: auto;
      }
      .proof-label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 15px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .proof-amount {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }
      .proof-amount strong {
        font-size: 78px;
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1;
        color: #f8fafc;
      }
      .proof-amount span {
        font-size: 30px;
        font-weight: 600;
        color: var(--ion);
      }
      .proof-meta {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 20px;
        font-weight: 500;
        color: #94a3b8;
      }
      .proof-meta .sep {
        color: rgba(148, 163, 184, 0.55);
      }
      .proof-meta .mono {
        font-family: "IBM Plex Mono", monospace;
        font-size: 18px;
      }
      .proof-stats {
        display: flex;
        gap: 48px;
        border-top: 1px solid rgba(148, 163, 184, 0.16);
        padding-top: 22px;
      }
      .proof-stat {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .proof-stat .k {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .proof-stat .v {
        font-size: 20px;
        font-weight: 600;
        color: #e2e8f0;
      }
      .proof-foot {
        display: flex;
        justify-content: space-between;
        font-family: "IBM Plex Mono", monospace;
        font-size: 15px;
        color: rgba(148, 163, 184, 0.85);
        padding-top: 4px;
      }

      /* ---------- split ---------- */
      .t-split .body {
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
        gap: 40px;
      }
      .t-split h1 {
        font-size: 82px;
      }
      .split-row {
        display: flex;
        gap: 28px;
      }
      .split-col {
        flex: 1;
        border-radius: 20px;
        padding: 32px 34px 34px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }
      .split-col.muted {
        background: rgba(7, 11, 20, 0.62);
        border: 1px solid var(--line-strong);
        backdrop-filter: blur(6px);
      }
      .split-col.brand {
        background: var(--bloom);
        border: 1px solid rgba(0, 80, 224, 0.4);
        box-shadow: 0 30px 70px rgba(0, 24, 90, 0.45);
      }
      .split-tag {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 500;
        font-size: 16px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .split-col.brand .split-tag {
        color: #cfe0ff;
      }
      .split-title {
        font-size: 38px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .split-items {
        list-style: none;
        margin: 6px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .split-items li {
        display: flex;
        gap: 12px;
        font-size: 21px;
        line-height: 1.35;
        color: #cbd5e1;
      }
      .split-col.brand .split-items li {
        color: #eaf1ff;
      }
      .split-items li::before {
        content: "";
        margin-top: 8px;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        flex-shrink: 0;
        background: rgba(148, 163, 184, 0.55);
      }
      .split-col.brand .split-items li::before {
        background: #ffffff;
      }

      /* ---------- stat ---------- */
      .t-stat .body {
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 6px;
      }
      .stat-row {
        display: flex;
        align-items: baseline;
        gap: 28px;
      }
      .stat-num {
        font-size: 216px;
        font-weight: 700;
        letter-spacing: -0.05em;
        line-height: 0.95;
        background: linear-gradient(180deg, #ffffff 30%, #7ba6ff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .stat-caption {
        font-size: 44px;
        font-weight: 600;
        color: var(--dim);
        letter-spacing: -0.02em;
      }
      .t-stat h1 {
        font-size: 76px;
        margin-top: 18px;
      }
      .t-stat .lead {
        font-size: 25px;
        margin-top: 20px;
        max-width: 860px;
      }
      .meta-row {
        display: flex;
        gap: 12px;
        margin-top: 34px;
        flex-wrap: wrap;
      }
      .meta-chip {
        font-family: "IBM Plex Mono", monospace;
        font-size: 17px;
        letter-spacing: 0.06em;
        color: #cbd5e1;
        border: 1px solid var(--line-strong);
        background: rgba(7, 11, 20, 0.5);
        border-radius: 999px;
        padding: 11px 20px;
      }

      /* ---------- modules ---------- */
      .t-modules .body {
        gap: 56px;
        align-items: center;
      }
      .t-modules .col-copy {
        width: 600px;
        flex-shrink: 0;
      }
      .t-modules h1 {
        font-size: 86px;
      }
      .t-modules .lead {
        font-size: 24px;
        max-width: 540px;
        margin-top: 22px;
      }
      .mod-grid {
        flex: 1;
        min-width: 0;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
      }
      .mod {
        border-radius: 16px;
        border: 1px solid var(--line-strong);
        background: rgba(7, 11, 20, 0.62);
        backdrop-filter: blur(6px);
        padding: 22px 24px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
      }
      .mod.live {
        background: var(--bloom);
        border-color: rgba(0, 80, 224, 0.42);
      }
      .mod-name {
        font-size: 27px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .mod-note {
        font-size: 18px;
        color: #a9b6c9;
        line-height: 1.35;
      }
      .mod.live .mod-note {
        color: #dbe7ff;
      }
      .mod-state {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(148, 163, 184, 0.8);
        margin-top: 2px;
      }
      .mod.live .mod-state {
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <img id="bg" src="/bahan/bcakgound.png" alt="" />
      <div id="veil"></div>
      <div id="frame"></div>
    </div>

    <script>
      const LOGO = "/bahan/archflows logo.png";

      function esc(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      // "Wallet lock is *ArcFlow*." -> accent span on the starred run
      function headline(text) {
        return esc(text).replace(/\*([^*]+)\*/g, '<span class="accent">$1</span>');
      }

      function topBar(post, right) {
        return `<div class="top">
          <img class="logo" src="${LOGO}" alt="ArcFlow" />
          ${right ?? `<div class="eyebrow">${esc(post.eyebrow)}</div>`}
        </div>`;
      }

      function bottomBar(post, note) {
        return `<div class="bottom">
          <span>${esc(post.footer ?? "arcflows.finance")}</span>
          <span class="rule-note">${esc(
            post.note ?? note ?? "Arc Testnet · chain 5042002 · gas in USDC"
          )}</span>
        </div>`;
      }

      const TEMPLATES = {
        statement(post) {
          return `${topBar(post)}
            <div class="body">
              <div>
                <h1>${headline(post.headline)}</h1>
                ${post.lead ? `<p class="lead">${esc(post.lead)}</p>` : ""}
              </div>
            </div>
            ${bottomBar(post)}`;
        },

        shot(post) {
          const bullets = (post.bullets ?? [])
            .map((item) => `<li>${esc(item)}</li>`)
            .join("");
          return `${topBar(post)}
            <div class="body">
              <div class="col-copy">
                <h1>${headline(post.headline)}</h1>
                ${post.lead ? `<p class="lead">${esc(post.lead)}</p>` : ""}
                ${bullets ? `<ul class="bullets">${bullets}</ul>` : ""}
              </div>
              <div class="shot-wrap">
                <div class="shot-glow"></div>
                <img class="shot" src="${esc(post.shot)}" alt="" />
              </div>
            </div>
            ${bottomBar(post)}`;
        },

        hero(post) {
          return `${topBar(post)}
            <div class="body">
              <div>
                <h1>${headline(post.headline)}</h1>
                ${post.lead ? `<p class="lead">${esc(post.lead)}</p>` : ""}
              </div>
              <div class="hero-shot"><img src="${esc(post.shot)}" alt="" /></div>
            </div>`;
        },

        proof(post) {
          const stats = (post.stats ?? [])
            .map(
              (stat) => `<div class="proof-stat">
                <span class="k">${esc(stat.label)}</span>
                <span class="v">${esc(stat.value)}</span>
              </div>`
            )
            .join("");
          return `${topBar(post)}
            <div class="body">
              <div class="col-copy">
                <h1>${headline(post.headline)}</h1>
                ${post.lead ? `<p class="lead">${esc(post.lead)}</p>` : ""}
              </div>
              <div class="proof-card">
                <img class="proof-bg" src="/bahan/bcakgound.png" alt="" />
                <div class="proof-veil"></div>
                <div class="proof-inner">
                  <div class="proof-head">
                    <img src="${LOGO}" alt="ArcFlow" />
                    <div class="pill">${esc(post.status)}</div>
                  </div>
                  <div>
                    <div class="proof-label">On-chain proof</div>
                    <div class="proof-amount" style="margin-top:12px">
                      <strong>${esc(post.amount)}</strong>
                      <span>${esc(post.symbol)}</span>
                    </div>
                  </div>
                  <div class="proof-meta">
                    <span>${esc(post.duration)}</span>
                    <span class="sep">|</span>
                    <span class="mono">CA ${esc(post.ca)}</span>
                  </div>
                  <div class="proof-stats">${stats}</div>
                  <div class="proof-foot">
                    <span>arcflows</span>
                    <span>${esc(post.lockUrl)}</span>
                  </div>
                </div>
              </div>
            </div>
            ${bottomBar(post, "No wallet needed to verify")}`;
        },

        split(post) {
          const columns = (post.columns ?? [])
            .map((column) => {
              const items = (column.items ?? [])
                .map((item) => `<li>${esc(item)}</li>`)
                .join("");
              return `<div class="split-col ${column.kind === "brand" ? "brand" : "muted"}">
                <div class="split-tag">${esc(column.tag)}</div>
                <div class="split-title">${esc(column.title)}</div>
                <ul class="split-items">${items}</ul>
              </div>`;
            })
            .join("");
          return `${topBar(post)}
            <div class="body">
              <h1>${headline(post.headline)}</h1>
              <div class="split-row">${columns}</div>
            </div>
            ${bottomBar(post)}`;
        },

        stat(post) {
          const chips = (post.meta ?? [])
            .map((item) => `<span class="meta-chip">${esc(item)}</span>`)
            .join("");
          return `${topBar(post)}
            <div class="body">
              <div>
                <div class="stat-row">
                  <span class="stat-num">${esc(post.stat)}</span>
                  <span class="stat-caption">${esc(post.statCaption)}</span>
                </div>
                <h1>${headline(post.headline)}</h1>
                ${post.lead ? `<p class="lead">${esc(post.lead)}</p>` : ""}
                ${chips ? `<div class="meta-row">${chips}</div>` : ""}
              </div>
            </div>
            ${bottomBar(post)}`;
        },

        modules(post) {
          const mods = (post.modules ?? [])
            .map(
              (mod) => `<div class="mod ${mod.state === "live" ? "live" : ""}">
                <div class="mod-name">${esc(mod.name)}</div>
                <div class="mod-note">${esc(mod.note)}</div>
                <div class="mod-state">${mod.state === "live" ? "Live" : "Coming soon"}</div>
              </div>`
            )
            .join("");
          return `${topBar(post)}
            <div class="body">
              <div class="col-copy">
                <h1>${headline(post.headline)}</h1>
                ${post.lead ? `<p class="lead">${esc(post.lead)}</p>` : ""}
              </div>
              <div class="mod-grid">${mods}</div>
            </div>
            ${bottomBar(post)}`;
        },
      };

      async function build() {
        const data = await (await fetch("posts.json")).json();
        const params = new URLSearchParams(location.search);
        const slug = params.get("slug");
        const index = slug
          ? data.posts.findIndex((post) => post.slug === slug)
          : Number(params.get("i") ?? 0);
        const post = data.posts[index];
        if (!post) throw new Error(`no post at ${slug ?? index}`);

        const render = TEMPLATES[post.template];
        if (!render) throw new Error(`unknown template ${post.template}`);

        const stage = document.getElementById("stage");
        stage.className = `t-${post.template}`;
        document.getElementById("frame").innerHTML = render(post);

        await document.fonts.ready;
        await Promise.all(
          [...document.images].map((img) =>
            img.complete
              ? Promise.resolve()
              : new Promise((resolve) => {
                  img.onload = resolve;
                  img.onerror = resolve;
                })
          )
        );
        window.__ready = true;
      }

      window.__buildError = null;
      build().catch((err) => {
        window.__buildError = String(err);
        window.__ready = true;
      });
    </script>
  </body>
</html>
